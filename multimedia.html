<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Getsemaní — Multimedia</title>
<script>
/* Guarda de acceso: sin sesión guardada por el login, se vuelve a index.html.
   Se ejecuta antes de pintar nada. "?demo=1" solo sirve para previsualizar; quítalo en producción. */
(function(){
  var ok=false;
  try{ var u=JSON.parse(localStorage.getItem('getsemani_user')); ok=!!(u&&u.name); }catch(e){}
  if(!ok && !/[?&]demo=1/.test(location.search)){
    document.documentElement.style.display='none';
    location.replace('index.html');
  }
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEAE1; --line:#D9D2C2; --panel:#FFFEFB; --ink:#21252E; --soft:#565B66;
  --steel:#3A5A74; --steel-d:#2A4258; --amber:#C1873B; --amber-s:#EEDDBD;
  --violet:#7A22E0; --night:#0B0418;
  --bar-h:76.8px; --logo-h:78.4px; --side-w:264px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans',sans-serif;color:var(--ink);background:var(--paper);font-size:15px}
body.big{font-size:18px}
body.contrast{--paper:#fff;--line:#000;--ink:#000;--soft:#000}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}

/* ---------- Barra superior ---------- */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--bar-h);z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand{flex-direction:column;align-items:flex-start;gap:3px}
.topbar>.burger{margin-right:auto}
.brand img{height:var(--logo-h);width:auto;max-width:260px;object-fit:contain;display:block}
.user{position:relative}
.user-btn{display:flex;align-items:center;gap:12px;background:none;border:0;padding:4px;border-radius:30px;color:inherit}
.user-txt{text-align:right;line-height:1.25}
.user-txt strong{display:block;font-weight:600;font-size:14px}
.user-txt span{font-size:12.5px;color:var(--soft)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--steel);color:#fff;display:grid;place-items:center;
  font-weight:600;overflow:hidden;border:2px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.menu-user{position:absolute;right:0;top:calc(100% + 8px);min-width:210px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 18px 36px -18px rgba(33,37,46,.5);padding:6px;display:none}
.menu-user.open{display:block}
.menu-user button{display:block;width:100%;text-align:left;padding:10px 12px;background:none;border:0;border-radius:6px;color:inherit}
.menu-user button:hover{background:var(--paper)}

/* ---------- Menú lateral ---------- */
.side{position:fixed;top:var(--bar-h);bottom:0;left:0;width:var(--side-w);background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;z-index:20;transition:transform .22s ease}
body.collapsed .side{transform:translateX(-100%)}
.side-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.burger{width:40px;height:40px;border:0;background:var(--amber-s);border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.side-head span{font-weight:600}
.nav{list-style:none;margin:0;padding:6px 0}
.nav a,.nav .group>button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 18px;color:var(--ink);text-decoration:none;
  background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.nav a:hover,.nav .group>button:hover{background:var(--paper)}
.nav a[aria-current="page"]{background:var(--amber-s);font-weight:600;box-shadow:inset 3px 0 var(--amber)}
.nav .sub{display:none;background:var(--paper)}
.nav .group.open .sub{display:block}
.nav .sub a{padding-left:46px;font-size:14px}
.nav .caret{margin-left:auto;transition:transform .18s}
.nav .group.open .caret{transform:rotate(90deg)}
.nav-title{padding:14px 18px 6px;font-size:12.5px;color:var(--soft);font-weight:600}

/* ---------- Color de barras rgb(65, 93, 128): barra superior y menú lateral ---------- */
:root{--barra:rgb(65, 93, 128);--barra-d:rgb(50, 74, 102)}
.topbar{background:var(--barra);border-bottom:1px solid var(--barra-d);color:#fff}
.user-txt span{color:rgba(255,255,255,.85)}
.avatar{border-color:rgba(255,255,255,.7)}
.user-btn:hover .avatar{border-color:#fff}
.menu-user{color:var(--ink)}
.side{background:var(--barra);border-right:1px solid var(--barra-d);color:#fff}
.side-head{border-bottom:1px solid rgba(255,255,255,.25)}
.burger{background:rgba(255,255,255,.16);color:#fff}
.burger:hover{background:rgba(255,255,255,.28)}
.topbar :focus-visible,.side :focus-visible{outline-color:#fff}
.nav a,.nav .group>button{color:#fff;border-bottom:1px solid rgba(255,255,255,.2)}
.nav a:hover,.nav .group>button:hover{background:rgba(255,255,255,.14)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.22);box-shadow:inset 4px 0 var(--amber-s)}
.nav .sub{background:rgba(0,0,0,.18)}
.nav-title{color:rgba(255,255,255,.8)}

/* ---------- Departamentos en el menú ---------- */
.nav .sub a{justify-content:space-between;gap:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--amber-s);color:var(--ink);font-weight:600;white-space:nowrap}
.nav .sub .empty{padding:12px 18px 12px 46px;font-size:13.5px;opacity:.85}

/* ---------- Departamentos: ventana emergente al pasar el cursor (se queda abierta) ---------- */
.nav .group .sub{display:none;position:fixed;left:var(--side-w);top:var(--bar-h);width:310px;max-height:calc(100vh - var(--bar-h) - 16px);overflow-y:auto;
  background:rgba(65,93,128,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;border:1px solid rgba(255,255,255,.25);border-left:0;border-radius:0 10px 10px 0;box-shadow:18px 18px 40px -18px rgba(33,37,46,.5);z-index:25}
.nav .group.open .sub{display:block}
.nav .group .sub a{color:#fff;padding:10px 18px;border-bottom:1px solid rgba(255,255,255,.2)}
.nav .group .sub a:hover{background:rgba(255,255,255,.16)}
.nav .group .sub .empty{padding-left:18px}
.nav .group.open .caret{transform:none}
body.collapsed .nav .group .sub{display:none!important}
@media (max-width:860px){
  body:not(.open-mobile) .nav .group .sub{display:none!important}
  .nav .group .sub{left:12px;width:calc(100vw - 24px);border-left:1px solid rgba(255,255,255,.25);border-radius:10px}
}


/* ---------- Contenido ---------- */
main{margin:var(--bar-h) 0 0 var(--side-w);padding:20px;transition:margin .22s ease}
body.collapsed main{margin-left:0}
.hero{position:relative;height:min(62vh,520px);min-height:380px;border-radius:6px;overflow:hidden;background:var(--night);color:#fff;isolation:isolate}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(24px,8vw,110px);
  opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s}
.slide.on{opacity:1;visibility:visible}
.slide h1{font:600 clamp(40px,6.5vw,68px)/1.05 'Newsreader',serif;margin:0 0 18px}
.slide p{max-width:520px;margin:0 0 30px;font-size:clamp(15px,1.7vw,18px);line-height:1.5}
.cta{align-self:flex-start;padding:12px 24px;border:0;border-radius:30px;background:var(--violet);color:#fff;font-weight:600;letter-spacing:.02em}
.cta:hover{background:#8f3ff0}
.orb{position:absolute;inset:0;z-index:-1;background:
  radial-gradient(ellipse 70% 90% at 80% -20%,rgba(190,70,255,.75),transparent 60%),
  radial-gradient(ellipse 50% 60% at 95% 30%,rgba(40,130,255,.55),transparent 65%),
  linear-gradient(120deg,#05010d 30%,#1b0640)}
.orb::after{content:"";position:absolute;inset:0;opacity:.7;
  background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1.5px);background-size:14px 14px;
  -webkit-mask-image:radial-gradient(ellipse 60% 80% at 85% 0%,#000,transparent 70%);mask-image:radial-gradient(ellipse 60% 80% at 85% 0%,#000,transparent 70%)}
.s2 .orb{filter:hue-rotate(-50deg)} .s3 .orb{filter:hue-rotate(60deg)} .s4 .orb{filter:hue-rotate(150deg)}
.dots{position:absolute;right:28px;bottom:20px;display:flex;gap:12px}
.dots button{width:11px;height:11px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.45)}
.dots button[aria-current="true"]{background:#fff}

.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.panel h2{font:600 20px 'Newsreader',serif;margin:0 0 10px}
.panel p{margin:0 0 8px;color:var(--soft);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:6px 12px;border-radius:20px;background:var(--amber-s);font-size:13.5px}

/* ---------- Flotantes ---------- */
.fab{position:fixed;right:18px;z-index:40;width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.35)}
.fab-a11y{bottom:50%;background:#0f3a63}
.fab-chat{bottom:22px;background:#22c55e}
.a11y-panel{position:fixed;right:80px;bottom:50%;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:none;gap:6px;flex-direction:column}
.a11y-panel.open{display:flex}
.a11y-panel button{padding:9px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);text-align:left}

@media (max-width:860px){
  :root{--side-w:260px}
  .side{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.open-mobile .side{transform:none}
  body.collapsed .side{transform:translateX(-100%)}
  main,body.collapsed main{margin-left:0;padding:12px}
  .user-txt{display:none}
  .fab-a11y{bottom:90px}.a11y-panel{bottom:90px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Ventanas: En vivo · Multimedia · Anuncios ---------- */
.page-head h1{font:600 clamp(26px,3.4vw,34px) 'Newsreader',serif;margin:0 0 4px}
.page-head p{margin:0 0 16px;color:var(--soft)}
.pantalla{position:relative;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;border-bottom:3px solid var(--amber)}
.pantalla iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.acciones{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 0 4px}
.btn{font:inherit;font-weight:600;color:#fff;background:var(--steel);border:1px solid var(--steel);border-radius:6px;padding:10px 16px;text-decoration:none;display:inline-block}
.btn:hover{background:var(--steel-d)}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--soft)}
.btn.sec:hover{background:var(--amber-s)}
.btn.mini{padding:5px 10px;font-size:13px;font-weight:500}
.nota{color:var(--soft);max-width:70ch;font-size:14px;margin:8px 0 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tabs button{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.card .media{aspect-ratio:16/9;background:#000;position:relative}
.card .media iframe,.card .media video,.card .media img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.card .audio{padding:18px 16px 0;background:var(--amber-s)}
.card .audio audio{width:100%}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font:600 18px 'Newsreader',serif;margin:0}
.card p{margin:0;color:var(--soft);line-height:1.45;font-size:14px}
.meta{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--soft);margin-top:auto;padding-top:6px}
.vacio{background:var(--panel);border:1px dashed var(--line);border-radius:6px;padding:28px;text-align:center;color:var(--soft)}
.form-panel{margin-bottom:22px}
.form-panel summary{cursor:pointer;font-weight:600}
.form-panel .campos{display:grid;gap:12px;margin-top:14px;max-width:640px}
.form-panel label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
.form-panel input,.form-panel select,.form-panel textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.form-panel textarea{min-height:110px;resize:vertical}
.form-panel .err{color:#a32020;font-size:13.5px;min-height:1em;margin:0}
.lista{display:grid;gap:16px;max-width:820px}
.anuncio{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:6px;padding:18px 22px}
.anuncio h3{font:600 20px 'Newsreader',serif;margin:0 0 4px}
.anuncio .txt{margin:8px 0 10px;line-height:1.55;white-space:pre-wrap}
.aviso-mini{padding:8px 0;border-bottom:1px solid var(--line)}
.aviso-mini:last-child{border-bottom:0}
.aviso-mini strong{display:block}
.aviso-mini span{font-size:12.5px;color:var(--soft)}
</style>

<script>
/* ============ 1. USUARIO ============
   Todos los registros son 'miembro'. Los roles director/subdirector (y sus departamentos)
   los asigna un administrador desde admin.html.
   El login (index.html) guarda al terminar:
   localStorage.setItem('getsemani_user', JSON.stringify({
     name, email, photo, roles: [...], departamentos_director: [...], departamentos_subdirector: [...]
   }));
*/
const PAGINA='multimedia.html';
function loadUser(){
  try{
    const u = JSON.parse(localStorage.getItem('getsemani_user'));
    if(u && u.name){
      // El administrador pudo cambiar los roles después de que esta persona inició sesión: se usa el perfil guardado
      let p=null; try{ p=(JSON.parse(localStorage.getItem('getsemani_profiles'))||{})[(u.email||'').toLowerCase()]; }catch(e){}
      const s = p || u;
      const roles = (s.roles && s.roles.length) ? [...s.roles] : ['miembro'];
      // Los correos de ADMIN_EMAILS (los mismos de index.html) siempre son administradores
      const ADMINS = ['getsemaniso2020@gmail.com','balmerarteaga23@gmail.com'];
      if(ADMINS.includes((u.email||'').toLowerCase()) && !roles.includes('administrador')) roles.push('administrador');
      return {
        name: u.name,
        email: u.email || '',
        photo: u.photo || '',
        roles,
        // Solo exponemos los departamentos si el rol correspondiente está activo
        cd: roles.includes('director')    ? (s.departamentos_director    || []) : [],
        cs: roles.includes('subdirector') ? (s.departamentos_subdirector || []) : []
      };
    }
  }catch(e){}
  return null;
}
function requireSession(){
  if(!loadUser()){ document.documentElement.style.display='none'; location.replace('index.html'); }
}
addEventListener('pageshow', requireSession);          // botón Atrás (caché del navegador)
addEventListener('storage', e => { if(e.key==='getsemani_user') requireSession(); }); // cierre de sesión en otra pestaña
const user = loadUser();
if(!user) throw new Error('Sin sesión'); // requireSession ya redirige; esto evita errores en consola

/* ============ DEPARTAMENTOS ============
   Cada persona ve los departamentos que le corresponden según sus roles. */
const DEPARTAMENTOS = ['Ancianos','Aventureros','Conquistadores','Coordinador de Interesados','Diaconisa','Diácono','Dorcas',
  'Educación','Escuela Sabática','Guías Mayores','Mayordomía','Ministerio de Comunicación','Ministerio de Oración',
  'Ministerio de Publicaciones','Ministerio de Salud','Ministerio de la Mujer','Ministerio Familiar','Ministerio Infantil',
  'Ministerio Juvenil','Ministerio Personal','Música y Adoración','Secretaría','Tesorería'];
let deptOpen = false;
// Todos los departamentos conocidos + los que le asignaron al usuario (aunque no estén en la lista)
function allDepts(){
  const extra = [...user.cd, ...user.cs].filter(d => !DEPARTAMENTOS.includes(d));
  return [...DEPARTAMENTOS, ...extra];
}
// Departamentos que puede ver cada persona según sus roles:
// administrador = todos; director/subdirector = solo los que le asignaron; miembro = ninguno
function deptPool(){
  if(user.roles.includes('administrador')) return allDepts();
  return [...new Set([...user.cd, ...user.cs])];
}
// Orden: primero los que dirige/apoya, luego el resto
function visibleDepts(){
  const mine = [...user.cd, ...user.cs];
  const rank = d => mine.includes(d) ? 0 : 1;
  return deptPool().sort((a,b) => rank(a)-rank(b));
}

const ROLE_LABEL = {administrador:'Administrador',director:'Director',subdirector:'Subdirector',miembro:'Miembro de iglesia'};

/* ============ 2. RENDER SEGÚN ROL ============ */
const slug = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
function render(){
  const first = user.name.split(' ')[0];
  document.getElementById('uName').textContent = user.name;
  document.getElementById('uRole').textContent = user.roles.map(r=>ROLE_LABEL[r]).join(' · ');
  const av = document.getElementById('uAvatar');
  av.innerHTML = '';
  if(user.photo){
    const i = new Image(); i.alt = ''; i.src = user.photo;
    i.onerror = () => { av.textContent = initials(); };
    av.appendChild(i);
  } else {
    av.textContent = initials();
  }

  const wEl=document.getElementById('welcome'); if(wEl) wEl.textContent = 'Hola, ' + first;
  const isDir = user.roles.includes('director'), isSub = user.roles.includes('subdirector'), isAdmin = user.roles.includes('administrador');
  const wtxt =
    isAdmin ? 'Desde aquí puedes asignar roles y departamentos a las personas que se registran.' :
    isDir ? 'Desde aquí puedes coordinar tus departamentos y revisar los registros pendientes.' :
    isSub ? 'Desde aquí puedes apoyar a tu director en los departamentos que te asignaron.' :
            'Aquí encuentras la transmisión en vivo, el contenido multimedia y los anuncios de tu iglesia.';
  const wtEl=document.getElementById('welcomeTxt'); if(wtEl) wtEl.textContent = wtxt;
  const chips = document.getElementById('chips') || document.createElement('div'); chips.innerHTML='';
  [...user.cd.map(d=>d+' (Director)'),...user.cs.map(d=>d+' (Subdirector)')].forEach(t=>{
    const c=document.createElement('span'); c.className='chip'; c.textContent=t; chips.appendChild(c);
  });

  const nav = document.getElementById('nav'); nav.innerHTML='';
  const link = (t,h)=>`<li><a href="${h}"${h===PAGINA?' aria-current="page"':''}>${t}</a></li>`;
  let html = link('Inicio','inicio.html')
    + link('En vivo','envivo.html')
    + link('Multimedia','multimedia.html')
    + link('Anuncios','anuncios.html')
    + link('Mi perfil','perfil.html');

  // Departamentos en el menú según el rol: administrador, director o subdirector (los miembros no lo ven)
  if(isAdmin || isDir || isSub){
  // Todos los departamentos van en el menú; el usuario decide cuáles ver y cuáles fijar arriba
  const roleOf = d => (user.cd.includes(d) ? 'Director' : user.cs.includes(d) ? 'Subdirector' : '');
  const list = visibleDepts();
  const deptItems = list.length
    ? list.map(d=>{
        const r = roleOf(d);
        return `<li><a href="departamento.html?d=${slug(d)}"><span>${d}</span>${r?`<span class="tag">${r}</span>`:''}</a></li>`;
      }).join('')
    : `<li class="empty">${deptPool().length ? 'No tienes departamentos visibles.' : 'Aún no tienes departamentos asignados.'}</li>`;
    html += `<li class="nav-title">Departamentos</li>`
    + `<li class="group${deptOpen?' open':''}"><button type="button" aria-expanded="${deptOpen}">Departamentos (${list.length})<svg class="caret" width="12" height="12" viewBox="0 0 12 12"><path d="M4 1l5 5-5 5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
    <ul class="sub nav" style="padding:0;list-style:none">${deptItems}</ul></li>`;

  }

  // Sección que solo aparece para administradores
  if(isAdmin){
    html += `<li class="nav-title">Administración</li>` + link('Asignar roles','admin.html');
  }
  nav.innerHTML = html;
  const gb = nav.querySelector('.group > button');
  if(gb){
    gb.addEventListener('mouseenter',()=>setDept(true));
    gb.addEventListener('click',()=>setDept(!deptOpen));
    if(deptOpen) setDept(true);
  }
}
/* Ventana emergente de departamentos: se abre al pasar el cursor y NO se cierra al salir;
   se cierra con clic en el botón, clic fuera de ella o Esc. */
function setDept(o){
  const g=document.querySelector('#nav .group'); if(!g) return;
  const gb=g.querySelector('button'), sub=g.querySelector('.sub');
  deptOpen=o; g.classList.toggle('open',o); gb.setAttribute('aria-expanded',o);
  if(o){
    const barH=document.querySelector('.topbar').offsetHeight;
    sub.style.top=Math.max(barH, Math.min(gb.getBoundingClientRect().top, innerHeight-sub.offsetHeight-8))+'px';
  }
}
document.addEventListener('click',e=>{ if(deptOpen && !e.target.closest('#nav .group')) setDept(false); });
addEventListener('keydown',e=>{ if(e.key==='Escape' && deptOpen) setDept(false); });
function initials(){ return user.name.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase(); }
render();
render();


const ES_FECHA = () => new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'});
const PUEDE_PUBLICAR = user.roles.some(r => ['administrador','director','subdirector'].includes(r));
const PUEDE_BORRAR = it => user.roles.includes('administrador') || (it.email && it.email === user.email);
function leer(k){ try{ return JSON.parse(localStorage.getItem(k)) || []; }catch(e){ return []; } }
function guardar(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
const urlOk = u => /^https?:\/\//i.test(u);
const el = (t,c,x) => { const n=document.createElement(t); if(c) n.className=c; if(x!==undefined) n.textContent=x; return n; };

/* ============ PÁGINA: MULTIMEDIA ============ */
const MKEY = 'getsemani_multimedia';
const ETIQ = {video:'Video',audio:'Audio',foto:'Foto'};
let filtro = 'todo';
function ytEmbed(u){
  const m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  return m ? 'https://www.youtube.com/embed/' + m[1] : null;
}
function tarjeta(it){
  const c = el('article','card');
  if(it.tipo==='video'){
    const m = el('div','media'), yt = ytEmbed(it.url);
    if(yt){ const f=document.createElement('iframe'); f.src=yt; f.title=it.titulo; f.loading='lazy'; f.allowFullscreen=true; f.allow='fullscreen; encrypted-media'; m.appendChild(f); }
    else { const v=document.createElement('video'); v.src=it.url; v.controls=true; v.preload='metadata'; m.appendChild(v); }
    c.appendChild(m);
  } else if(it.tipo==='foto'){
    const m = el('div','media'), i=new Image(); i.src=it.url; i.alt=it.titulo; i.loading='lazy'; m.appendChild(i); c.appendChild(m);
  } else {
    const a = el('div','audio'), au=document.createElement('audio'); au.src=it.url; au.controls=true; au.preload='none'; a.appendChild(au); c.appendChild(a);
  }
  const b = el('div','body');
  b.appendChild(el('h3',null,it.titulo));
  if(it.desc) b.appendChild(el('p',null,it.desc));
  const meta = el('div','meta'); meta.appendChild(el('span',null,ETIQ[it.tipo] + ' · ' + it.fecha));
  if(PUEDE_BORRAR(it)){
    const d = el('button','btn sec mini','Eliminar'); d.type='button';
    d.addEventListener('click',()=>{ if(confirm('¿Eliminar este contenido?')){ guardar(MKEY, leer(MKEY).filter(x=>x.id!==it.id)); pintar(); } });
    meta.appendChild(d);
  }
  b.appendChild(meta); c.appendChild(b);
  return c;
}
function pintar(){
  const g = document.getElementById('grid'); g.innerHTML='';
  const items = leer(MKEY).filter(i => filtro==='todo' || i.tipo===filtro);
  if(!items.length){
    g.appendChild(el('div','vacio', filtro==='todo' ? 'Aún no hay contenido multimedia.' + (PUEDE_PUBLICAR ? ' Usa «Agregar contenido» para publicar el primero.' : '') : 'No hay contenido de este tipo todavía.'));
    return;
  }
  items.forEach(i => g.appendChild(tarjeta(i)));
}
document.getElementById('tabs').addEventListener('click', e=>{
  const f = e.target.dataset.f; if(!f) return;
  filtro = f;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f===f));
  pintar();
});
if(PUEDE_PUBLICAR){
  document.getElementById('formBox').hidden = false;
  document.getElementById('mGuardar').addEventListener('click',()=>{
    const err = document.getElementById('mErr');
    const tipo = document.getElementById('mTipo').value, titulo = document.getElementById('mTitulo').value.trim(),
          desc = document.getElementById('mDesc').value.trim(), url = document.getElementById('mUrl').value.trim();
    if(!titulo){ err.textContent='Escribe un título.'; return; }
    if(!urlOk(url)){ err.textContent='El enlace debe empezar por http:// o https://'; return; }
    err.textContent='';
    const all = leer(MKEY);
    all.unshift({id:Date.now().toString(36), tipo, titulo, desc, url, fecha:ES_FECHA(), email:user.email});
    guardar(MKEY, all);
    ['mTitulo','mDesc','mUrl'].forEach(i=>document.getElementById(i).value='');
    pintar();
  });
}
pintar();

/* ============ 4. INTERACCIONES ============ */
const body=document.body, mobile=()=>matchMedia('(max-width:860px)').matches;
document.getElementById('burger').addEventListener('click',()=>{
  if(mobile()) body.classList.remove('open-mobile'); else body.classList.toggle('collapsed');
});
// En escritorio, si el menú está oculto, el icono vuelve a abrirse desde la barra superior
const reopen=document.createElement('button');
reopen.className='burger'; reopen.setAttribute('aria-label','Abrir menú');
reopen.style.cssText='position:fixed;top:12px;left:200px;z-index:31;display:none';
reopen.innerHTML=document.getElementById('burger').innerHTML;
document.querySelector('.brand').after(reopen);
reopen.style.position='static'; reopen.style.marginLeft='8px';
reopen.addEventListener('click',()=>{ if(mobile()) body.classList.toggle('open-mobile'); else body.classList.remove('collapsed'); });
function syncReopen(){ reopen.style.display = (mobile()||body.classList.contains('collapsed')) ? 'grid' : 'none'; }
new MutationObserver(syncReopen).observe(body,{attributes:true}); addEventListener('resize',syncReopen); syncReopen();

const uBtn=document.getElementById('userBtn'), uMenu=document.getElementById('userMenu');
uBtn.addEventListener('click',e=>{e.stopPropagation();const o=uMenu.classList.toggle('open');uBtn.setAttribute('aria-expanded',o)});
document.addEventListener('click',()=>{uMenu.classList.remove('open');uBtn.setAttribute('aria-expanded','false')});
document.getElementById('goProfile').addEventListener('click',()=>location.href='perfil.html');
document.getElementById('logout').addEventListener('click',()=>{ try{localStorage.removeItem('getsemani_user')}catch(e){} location.href='index.html'; });


const aBtn=document.getElementById('a11yBtn'), aPanel=document.getElementById('a11yPanel');
aBtn.addEventListener('click',()=>{const o=aPanel.classList.toggle('open');aBtn.setAttribute('aria-expanded',o)});
aPanel.addEventListener('click',e=>{
  const a=e.target.dataset.a; if(!a) return;
  if(a==='big') body.classList.toggle('big');
  if(a==='contrast') body.classList.toggle('contrast');
  if(a==='reset') body.classList.remove('big','contrast');
});
</script>
</body>
