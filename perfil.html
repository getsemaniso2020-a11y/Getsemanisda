<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Getsemaní — Mi perfil</title>
<script>
/* Guarda de sesión: sin sesión iniciada se vuelve al login. */
(function(){
  var ok=false;
  try{ var u=JSON.parse(localStorage.getItem('getsemani_user')); ok=!!(u&&u.name); }catch(e){}
  if(!ok){ document.documentElement.style.display='none'; location.replace('index.html'); }
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDEAE1;--line:#D9D2C2;--panel:#FFFEFB;--ink:#21252E;--soft:#565B66;--steel:#3A5A74;--amber:#C1873B;--amber-s:#EEDDBD;--barra:rgb(65,93,128)}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);font-size:15px}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
header{background:var(--barra);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);padding:8px 14px;border-radius:6px;font-size:14px}
header a:hover{background:rgba(255,255,255,.14)}
header h1{font:600 22px 'Newsreader',serif;margin:0}
main{max-width:680px;margin:0 auto;padding:24px 20px 48px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.top{display:flex;align-items:center;gap:18px;padding:24px}
.avatar{width:76px;height:76px;border-radius:50%;flex:none;background:var(--steel);color:#fff;display:grid;place-items:center;font:600 28px 'Newsreader',serif;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.top h2{font:600 26px/1.15 'Newsreader',serif;margin:0 0 4px;word-break:break-word}
.top p{margin:0;color:var(--soft);word-break:break-all}
dl{margin:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:170px 1fr;gap:6px 18px;padding:16px 24px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
dt{color:var(--soft);font-weight:500}
dd{margin:0;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--amber-s);border-radius:12px;padding:3px 11px;font-size:13.5px}
.chip.rol{background:var(--steel);color:#fff}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;cursor:pointer;padding:7px 14px;border:1px solid var(--steel);background:var(--panel);color:var(--steel);border-radius:6px;font-weight:600;font-size:14px}
.btn:hover{background:var(--steel);color:#fff}
.btn.primary{background:var(--steel);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.suave{border-color:var(--line);color:var(--soft);font-weight:500}
.btn.suave:hover{background:var(--paper);color:var(--ink)}
.editable{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.editable input[type=text]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.nota{color:var(--soft);font-size:13.5px;margin:6px 0 0}
.error{color:#9B2C2C;font-size:13.5px;margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
.group+.group{margin-top:12px}
.group>strong{display:block;font-weight:600;margin-bottom:6px}
.vacio{color:var(--soft);margin:0}
@media (max-width:520px){.row{grid-template-columns:1fr;gap:4px}.top{padding:20px}}
</style>
</head>
<body>
<header>
  <a href="inicio.html">← Volver al inicio</a>
  <h1>Mi perfil</h1>
</header>

<main>
  <section class="card" aria-label="Datos de mi cuenta">
    <div class="top">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div>
        <h2 id="nombre"></h2>
        <p id="correoTop"></p>
        <div class="acciones">
          <button type="button" class="btn" id="btnFoto">Cambiar foto</button>
          <button type="button" class="btn suave" id="btnQuitar">Quitar foto</button>
        </div>
        <input type="file" id="archivo" accept="image/*" hidden>
      </div>
    </div>
    <dl>
      <div class="row"><dt>Nombre y apellido</dt><dd id="fNombre"></dd></div>
      <div class="row"><dt>Correo</dt><dd><span id="fCorreo"></span><p class="nota">El correo es tu cuenta y no se puede cambiar desde aquí.</p></dd></div>
      <div class="row"><dt>Rol</dt><dd id="fRoles"></dd></div>
      <div class="row"><dt>Departamentos</dt><dd id="fDeptos"></dd></div>
    </dl>
  </section>
</main>
<div id="toast" role="status"></div>

<script>
/* Los datos salen del usuario con sesión (editables: nombre y foto) (getsemani_user). Los roles y departamentos se leen del perfil
   guardado, porque el administrador pudo cambiarlos después de que la persona inició sesión.
   TODO backend: reemplazar por una consulta al servidor. */
const ADMINS = ['getsemaniso2020@gmail.com','balmerarteaga23@gmail.com'];   // mismos correos que ADMIN_EMAILS en index.html
const LABEL = {miembro:'Miembro', director:'Director', subdirector:'Subdirector', administrador:'Administrador'};
const ORDEN = ['administrador','director','subdirector','miembro'];

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

function cargar(){
  let u = null;
  try{ u = JSON.parse(localStorage.getItem('getsemani_user')); }catch(e){}
  if(!u || !u.name) return null;   // sin sesión: la guarda de arriba ya redirige al login
  let p = null;
  try{ p = (JSON.parse(localStorage.getItem('getsemani_profiles')) || {})[(u.email || '').toLowerCase()]; }catch(e){}
  const s = p || u;
  const roles = (s.roles && s.roles.length) ? [...s.roles] : ['miembro'];
  if(ADMINS.includes((u.email || '').toLowerCase()) && !roles.includes('administrador')) roles.push('administrador');
  return {
    name: u.name, email: u.email || '', photo: u.photo || '', roles,
    cd: roles.includes('director')    ? (s.departamentos_director    || []) : [],
    cs: roles.includes('subdirector') ? (s.departamentos_subdirector || []) : []
  };
}

let user = cargar();
if(user){ pintar(); }

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }

/* Guarda los cambios en la sesión (getsemani_user) y en el perfil que ve el administrador (getsemani_profiles) */
function guardarCambios(cambios){
  try{
    const u = JSON.parse(localStorage.getItem('getsemani_user'));
    Object.assign(u, cambios);
    const todos = JSON.parse(localStorage.getItem('getsemani_profiles')) || {};
    const key = (u.email || '').toLowerCase();
    if(todos[key]) Object.assign(todos[key], cambios);
    localStorage.setItem('getsemani_user', JSON.stringify(u));
    localStorage.setItem('getsemani_profiles', JSON.stringify(todos));
    Object.assign(user, cambios);
    return true;
  }catch(e){ return false; }   // por ejemplo, almacenamiento lleno
}

/* ---------- Pintar ---------- */
function pintar(){
  const iniciales = user.name.trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
  const av = $('avatar');
  if(user.photo){
    av.innerHTML = '<img alt="" referrerpolicy="no-referrer" src="' + esc(user.photo) + '">';
    av.querySelector('img').addEventListener('error', () => { av.textContent = iniciales; });
  }else{
    av.textContent = iniciales;
  }
  $('btnFoto').textContent = user.photo ? 'Cambiar foto' : 'Agregar foto';
  $('btnQuitar').style.display = user.photo ? '' : 'none';

  $('nombre').textContent = user.name;
  $('correoTop').textContent = user.email;
  verNombre();
  $('fCorreo').textContent = user.email || 'Sin correo registrado';

  $('fRoles').innerHTML = '<div class="chips">' + ORDEN.filter(r => user.roles.includes(r))
    .map(r => '<span class="chip rol">' + LABEL[r] + '</span>').join('') + '</div>';

  const grupos = [];
  if(user.cd.length) grupos.push(['Director de', user.cd]);
  if(user.cs.length) grupos.push(['Subdirector de', user.cs]);
  if(grupos.length){
    $('fDeptos').innerHTML = grupos.map(([t, list]) =>
      '<div class="group"><strong>' + t + '</strong><div class="chips">' +
      list.map(d => '<span class="chip">' + esc(d) + '</span>').join('') + '</div></div>').join('');
  }else if(user.roles.includes('director') || user.roles.includes('subdirector')){
    $('fDeptos').innerHTML = '<p class="vacio">Aún no tienes departamentos asignados. Un administrador puede asignártelos.</p>';
  }else if(user.roles.includes('administrador')){
    $('fDeptos').innerHTML = '<p class="vacio">Como administrador ves todos los departamentos.</p>';
  }else{
    $('fDeptos').innerHTML = '<p class="vacio">Eres miembro, por eso no tienes departamentos asignados.</p>';
  }
}

/* ---------- Editar nombre ---------- */
function verNombre(){
  $('fNombre').innerHTML = '<div class="editable"><span id="txtNombre"></span><button type="button" class="btn" id="btnEditar">Editar nombre</button></div>';
  $('txtNombre').textContent = user.name;
  $('btnEditar').addEventListener('click', editarNombre);
}
function editarNombre(){
  $('fNombre').innerHTML = '<div class="editable"><input type="text" id="inNombre" maxlength="80" autocomplete="name" aria-label="Nombre y apellido">' +
    '<span class="acciones" style="margin:0"><button type="button" class="btn primary" id="btnGuardar">Guardar cambios</button>' +
    '<button type="button" class="btn suave" id="btnCancelar">Cancelar</button></span></div><p class="error" id="errNombre" hidden></p>';
  const inp = $('inNombre'); inp.value = user.name; inp.focus(); inp.select();
  const guardar = () => {
    const v = inp.value.replace(/\s+/g,' ').trim();
    if(v.length < 2){ $('errNombre').textContent = 'Escribe tu nombre y apellido.'; $('errNombre').hidden = false; inp.focus(); return; }
    if(guardarCambios({name:v})){ pintar(); toast('Datos actualizados'); }
    else{ $('errNombre').textContent = 'No se pudo guardar. Intenta de nuevo.'; $('errNombre').hidden = false; }
  };
  $('btnGuardar').addEventListener('click', guardar);
  $('btnCancelar').addEventListener('click', verNombre);
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') guardar(); if(e.key === 'Escape') verNombre(); });
}

/* ---------- Foto ---------- */
/* La imagen se recorta al centro (cuadrada), se reduce a 320 px y se guarda como JPEG liviano. */
function reducirFoto(file){
  return new Promise((ok, fail) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const lado = Math.min(img.width, img.height), L = 320;
      const c = document.createElement('canvas'); c.width = c.height = L;
      c.getContext('2d').drawImage(img, (img.width-lado)/2, (img.height-lado)/2, lado, lado, 0, 0, L, L);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('imagen')); };
    img.src = url;
  });
}
$('btnFoto').addEventListener('click', () => $('archivo').click());
$('archivo').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('Elige un archivo de imagen (JPG, PNG o WebP).'); return; }
  if(f.size > 10*1024*1024){ toast('La imagen pesa más de 10 MB. Elige una más liviana.'); return; }
  try{
    const data = await reducirFoto(f);
    if(guardarCambios({photo:data})){ pintar(); toast('Foto actualizada'); }
    else toast('No se pudo guardar la foto. Intenta con otra imagen.');
  }catch(err){ toast('No se pudo leer la imagen. Prueba con otro archivo.'); }
});
$('btnQuitar').addEventListener('click', () => {
  if(guardarCambios({photo:''})){ pintar(); toast('Foto eliminada'); }
});
</script>
</body>
</html>
